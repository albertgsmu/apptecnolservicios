name: Recordatorios de reportes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: report-reminders
  cancel-in-progress: false
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Revisar vencimientos y enviar avisos
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const identity = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=jp-report-reminders', { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
          if (!identity.ok) throw new Error('No se pudo verificar el programador');
          const { value } = await identity.json();
          const response = await fetch('https://jp-mantenimiento.onrender.com/api/reminders/tick', { method: 'POST', headers: { Authorization: `Bearer ${value}` }, signal: AbortSignal.timeout(180000) });
          if (!response.ok) throw new Error(`La revisión respondió HTTP ${response.status}`);
          console.log('Revisión de reportes completada.');
          JS
